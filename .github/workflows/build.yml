name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: TTS-Windows-x64.exe
            build_cmd: pyinstaller --onefile --windowed --name "TTS-Windows-x64" app.py
          - os: macos-latest
            artifact_name: TTS-macOS-Intel
            build_cmd: |
              pyinstaller --onefile --windowed --name "TTS-macOS" app.py
              pip install dmgbuild
              echo 'application = "dist/TTS-macOS.app"' > dmg_settings.py
              echo 'volume_name = "TTS语音合成工具"' >> dmg_settings.py
              echo 'dmg_name = "dist/TTS-macOS.dmg"' >> dmg_settings.py
              echo 'background = None' >> dmg_settings.py
              echo 'files = ["dist/TTS-macOS.app"]' >> dmg_settings.py
              echo 'symlinks = {"Applications": "/Applications"}' >> dmg_settings.py
              dmgbuild -s dmg_settings.py 'TTS语音合成工具' dist/TTS-macOS.dmg
          - os: ubuntu-latest
            artifact_name: TTS-Linux-x64
            build_cmd: |
              pyinstaller --onefile --windowed --name "TTS-Linux-x64" app.py
              cd dist
              tar czf TTS-Linux-x64.tar.gz TTS-Linux-x64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build
      run: ${{ matrix.build_cmd }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          TTS-Windows-x64.exe/*
          TTS-macOS-Intel/*
          TTS-Linux-x64/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
