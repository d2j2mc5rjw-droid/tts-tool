name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest
            artifact_name: TTS-Windows-x64.exe
            build_cmd: pyinstaller --onefile --windowed --name "TTS-Windows-x64" app.py
          # macOS Intel
          - os: macos-13
            artifact_name: TTS-macOS-Intel
            build_cmd: pyinstaller --onefile --windowed --name "TTS-macOS-Intel" app.py
          # macOS Apple Silicon
          - os: macos-latest
            artifact_name: TTS-macOS-AppleSilicon
            build_cmd: pyinstaller --onefile --windowed --name "TTS-macOS-AppleSilicon" app.py
          # Linux
          - os: ubuntu-latest
            artifact_name: TTS-Linux-x64
            build_cmd: pyinstaller --onefile --windowed --name "TTS-Linux-x64" app.py

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build
      run: ${{ matrix.build_cmd }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4

    - name: List files
      run: find . -type f -name "TTS-*" | head -20

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          TTS-Windows-x64.exe/TTS-Windows-x64.exe
          TTS-macOS-Intel/TTS-macOS-Intel
          TTS-macOS-AppleSilicon/TTS-macOS-AppleSilicon
          TTS-Linux-x64/TTS-Linux-x64
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
